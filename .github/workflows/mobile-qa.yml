name: Taste of Nawlins Mobile QA
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * 1'
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run browser-level mobile QA
        run: node qa/mobile-release.mjs
        env:
          TASTE_BASE_URL: https://tasteofnawlins.netlify.app
      - name: Upload evidence even when QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste-mobile-qa
          path: qa-artifacts/
          if-no-files-found: warn
