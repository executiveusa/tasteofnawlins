name: Restore supplied coffee photograph
on:
  push:
    branches:
      - fix/mobile-media-20261017
    paths:
      - .github/workflows/restore-coffee-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-media-20261017
      - name: Fetch previously supplied product photo
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 3 'https://v3b.fal.media/files/b/0aae8e88/Xen0tpNxdsepRReAEXakP_cafe-du-monde-coffee-chicory-can.jpg.webp' -o public/images/cafe-du-monde-coffee-chicory-can.webp
          test "$(stat -c%s public/images/cafe-du-monde-coffee-chicory-can.webp)" -gt 10000
          file public/images/cafe-du-monde-coffee-chicory-can.webp | grep -i 'Web/P'
      - name: Commit exact product photo to preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/cafe-du-monde-coffee-chicory-can.webp
          git diff --cached --quiet || git commit -m 'Restore original Café du Monde product photograph'
          git push origin HEAD:fix/mobile-media-20261017
