name: Build Fal wordmark vector preview
on:
  push:
    branches: [fix/mobile-media-20261017]
    paths: [.github/workflows/install-fal-wordmark.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-media-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Fetch approved-style Fal generation and vectorize shapes
        env:
          FAL_IMAGE_URL: https://v3b.fal.media/files/b/0aaec2f6/WUvPH23Hq_9OMUfA5l-T2_e4rDjGFP.png
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 "$FAL_IMAGE_URL" -o public/images/taste-wordmark-fal-original.png
          python - <<'PY'
          import cv2,numpy as np
          from PIL import Image
          from pathlib import Path
          p=Path('public/images/taste-wordmark-fal-original.png')
          im=Image.open(p).convert('RGB')
          w,h=im.size
          a=np.array(im)
          # Trim near-white canvas; keep chromatic and dark shapes only.
          dark=np.min(a,axis=2)<225
          dark=cv2.morphologyEx(dark.astype('uint8'),cv2.MORPH_OPEN,np.ones((2,2),np.uint8))
          ys,xs=np.where(dark>0)
          assert len(xs)>1000,'No visible logo artwork detected'
          x0,x1=max(0,int(xs.min())-15),min(w,int(xs.max())+16)
          y0,y1=max(0,int(ys.min())-15),min(h,int(ys.max())+16)
          a=a[y0:y1,x0:x1]
          hh,ww=a.shape[:2]
          # Color-aware shape tracing. Colors are derived from original ink.
          sample=Image.fromarray(a).quantize(colors=7,method=Image.Quantize.MEDIANCUT)
          ids=np.array(sample); pal=np.array(sample.getpalette(),dtype=np.uint8).reshape(-1,3)
          pieces=[]
          for k in np.unique(ids):
              color=pal[int(k)]
              if np.min(color)>210:continue
              mask=((ids==k).astype('uint8')*255)
              mask=cv2.morphologyEx(mask,cv2.MORPH_OPEN,np.ones((2,2),np.uint8))
              contours,_=cv2.findContours(mask,cv2.RETR_CCOMP,cv2.CHAIN_APPROX_SIMPLE)
              for contour in contours:
                  if cv2.contourArea(contour)<4:continue
                  contour=cv2.approxPolyDP(contour,0.7,True)
                  if len(contour)<3:continue
                  pts=contour[:,0,:]
                  d='M'+' L'.join(f'{int(x)},{int(y)}' for x,y in pts)+' Z'
                  pieces.append((cv2.contourArea(contour),'<path fill="#%02x%02x%02x" fill-rule="evenodd" d="%s"/>'%(int(color[0]),int(color[1]),int(color[2]),d)))
          assert len(pieces)>10,'Insufficient paths traced'
          paths='\n'.join(p for _,p in sorted(pieces,reverse=True))
          svg=f'<svg xmlns="http://www.w3.org/2000/svg" width="{ww}" height="{hh}" viewBox="0 0 {ww} {hh}" role="img" aria-labelledby="title"><title id="title">Taste of Nawlins</title>{paths}</svg>'
          out=Path('public/images/taste-wordmark-fal.svg')
          out.write_text(svg,encoding='utf-8')
          print('SOURCE',w,h,'CROP',ww,hh,'PATHS',len(pieces),'SVG BYTES',out.stat().st_size)
          PY
      - name: Commit traced Fal artwork on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/taste-wordmark-fal.svg public/images/taste-wordmark-fal-original.png
          git diff --cached --quiet || git commit -m 'Add Fal-generated stacked restaurant wordmark and traced SVG'
          git push origin HEAD:fix/mobile-media-20261017
