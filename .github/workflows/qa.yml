name: Taste of Nawlins QA

on:
  push:
    branches:
      - build/collins-first-slice
  workflow_dispatch:

jobs:
  build-and-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/taste-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/taste-preview.log
          exit 1
      - name: Mobile and motion smoke test
        run: node qa/mobile-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste-of-nawlins-responsive-qa
          path: qa-artifacts/
          if-no-files-found: ignore
