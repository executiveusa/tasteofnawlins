name: Taste of Nawlins QA

on:
  push:
    branches:
      - main
      - build/collins-first-slice
      - fix/original-photo-quality
  workflow_dispatch:

jobs:
  build-and-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          mkdir -p qa-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/taste-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/taste-preview.log
          exit 1
      - name: Runtime mount smoke test
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            const bodyText = (await page.locator('body').innerText()).trim();
            const hero = await page.locator('h1').first().innerText().catch(() => '');
            const appFailed = await page.evaluate(() => document.documentElement.dataset.appFailed || '');
            if (!bodyText || !hero.includes('New Orleans food') || appFailed === 'true' || errors.length) {
              console.error({ bodyText, hero, appFailed, errors });
              await page.screenshot({ path: 'qa-artifacts/runtime-failure.png', fullPage: true });
              await browser.close();
              process.exit(1);
            }
            await page.screenshot({ path: 'qa-artifacts/runtime-390.png', fullPage: true });
            await browser.close();
          })();
          NODE
      - name: Mobile, image and motion smoke test
        run: node qa/mobile-smoke.mjs
      - name: Verify exact production image and browser runtime
        if: github.ref == 'refs/heads/main'
        run: |
          ready=0
          for i in {1..24}; do
            if curl -fsSL https://tasteofnawlins.netlify.app/images/table-3840.webp -o /tmp/taste-production-hero.webp && cmp -s public/images/table-3840.webp /tmp/taste-production-hero.webp; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          TASTE_BASE_URL=https://tasteofnawlins.netlify.app node qa/mobile-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste-of-nawlins-responsive-qa
          path: qa-artifacts/
          if-no-files-found: ignore
